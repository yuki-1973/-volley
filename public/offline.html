<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>バレー分析 (オフライン版)</title>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 10px; text-align: center; }
    .status { background: #22c55e; color: #000; padding: 5px; font-weight: bold; border-radius: 4px; margin-bottom: 10px; }
    .court { width: 100%; max-width: 400px; height: 300px; background: #eab308; border: 3px solid #fff; margin: 0 auto; position: relative; }
    .btn { padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; margin: 5px; cursor: pointer; }
    .btn-s { background-color: #facc15; color: #000; }
    .btn-l { background-color: #22c55e; color: #fff; }
    .btn-w { background-color: #ffffff; color: #000; }
    .btn-m { background-color: #84cc16; color: #000; }
    .btn-op { background-color: #f97316; color: #fff; }
  </style>
</head>
<body>
  <div class="status">⚡ 完全オフラインモード動作中</div>
  <h2>試合記録パネル</h2>
  
  <div class="court">
    <p style="color: #000; margin-top: 130px;">[ コートエリア ]</p>
  </div>

  <div style="margin-top: 15px;">
    <button class="btn btn-s">S (黄色)</button>
    <button class="btn btn-l">L (緑色)</button>
    <button class="btn btn-w">W (白色)</button>
    <button class="btn btn-m">MB (黄緑)</button>
    <button class="btn btn-op">OP (オレンジ)</button>
  </div>

  <script>
    console.log("オフライン専用アプリ起動完了");
  </script>
</body>
</html>
